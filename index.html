<body>
<div id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

var firebaseConfig = {
  apiKey: "AIzaSyA_cK2EZobBh8iRMYCL0WbtTPFWwr9iUrU",
  authDomain: "vocab-quiz-3291.firebaseapp.com",
  projectId: "vocab-quiz-3291",
  storageBucket: "vocab-quiz-3291.firebasestorage.app",
  messagingSenderId: "206018797680",
  appId: "1:206018797680:web:cc4d2438304282869594b5"
};
var firebaseApp = initializeApp(firebaseConfig);
var db = getFirestore(firebaseApp);
var wordsDocRef = doc(db, "vocabQuiz", "shared");
var statsDocRef = doc(db, "vocabQuiz", "stats");

(function(){
  "use strict";

  var STORAGE_KEY = "vocabQuizWords_v1";
  var STATS_STORAGE_KEY = "vocabQuizStats_v1";

  var SAMPLE_DATA = [
    { english: "get the hang of", japanese: "コツをつかむ", example: "It took me a while to get the hang of the new system.", exampleJa: "新しいシステムのコツをつかむのに少し時間がかかった。", pos: "イディオム", etymology: "「hang」はもともと「（物の）扱い方のクセ」を指す口語表現。", nuance: "\"learn\" よりくだけた言い方で、体で覚える感覚が強い。", related: "get a feel for（感覚をつかむ）、get used to（慣れる）" },
    { english: "on the fence", japanese: "決めかねている、迷っている", example: "I'm still on the fence about which job offer to accept.", exampleJa: "どちらの内定を受けるかまだ迷っている。", pos: "イディオム" },
    { english: "procrastinate", japanese: "先延ばしにする", example: "I always procrastinate when it comes to doing my taxes.", exampleJa: "確定申告のことになるといつも先延ばしにしてしまう。", pos: "動詞" },
    { english: "a piece of cake", japanese: "とても簡単なこと", example: "Don't worry, the exam was a piece of cake.", exampleJa: "心配しないで、その試験はとても簡単だった。", pos: "イディオム" },
    { english: "make ends meet", japanese: "生活をやりくりする、収支を合わせる", example: "It's hard to make ends meet with rising prices.", exampleJa: "物価上昇でやりくりするのは大変だ。", pos: "イディオム" }
  ];

  var state = {
    view: "quiz",
    words: [],
    stats: { perWord: {} },
    sessions: {},
    parked: {},
    statsOpen: "",
    quiz: {
      mode: "choice", kind: "normal", firstTry: {},
      queue: [],
      masteredCount: 0,
      totalUnique: 0,
      questionNumber: 0,
      current: null,
      answered: false,
      selectedChoice: null,
      isCorrect: null,
      choices: [],
      revealed: false,
      finished: false,
      arrangeTokens: [],
      arrangeOrder: [],
      arrangeSelected: []
    },
    list: { query: "", sort: "default", posFilter: "", letterFilter: "", limit: 50, open: "" }
  };

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (ch) {
      switch (ch) {
        case "&": return "&amp;";
        case "<": return "&lt;";
        case ">": return "&gt;";
        case '"': return "&quot;";
        case "'": return "&#39;";
      }
    });
  }

  function extraDetailsHtml(w) {
    var parts = [];
    if (w.etymology) parts.push('<div class="extra-item"><span class="extra-label">語源</span>' + escapeHtml(w.etymology) + '</div>');
    if (w.nuance) parts.push('<div class="extra-item"><span class="extra-label">ニュアンス</span>' + escapeHtml(w.nuance) + '</div>');
    if (w.related) parts.push('<div class="extra-item"><span class="extra-label">関連</span>' + escapeHtml(w.related) + '</div>');
    return parts.length ? '<div class="extra-details">' + parts.join("") + '</div>' : "";
  }

  function wkey(w) { return String(w.english || "").trim().toLowerCase(); }

  // 例文の中の見出し語を太字にする（「A / B」や「(rents)」の補足も考える。見つからなければ語幹で探す）
  function highlightExample(example, english) {
    var cands = String(english).split(/\s*\/\s*/).map(function (c) { return c.replace(/\([^)]*\)/g, " ").replace(/\s+/g, " ").trim(); }).filter(Boolean);
    var lower = example.toLowerCase();
    var start = -1, len = 0;
    for (var i = 0; i < cands.length && start < 0; i++) {
      var idx = lower.indexOf(cands[i].toLowerCase());
      if (idx >= 0) { start = idx; len = cands[i].length; }
    }
    if (start < 0) {
      for (var j = 0; j < cands.length && start < 0; j++) {
        var c = cands[j];
        if (c.indexOf(" ") !== -1 || c.length < 4) continue;
        var stem = c.slice(0, Math.max(4, c.length - 2)).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        var m = new RegExp("\\b" + stem + "[a-z]*", "i").exec(example);
        if (m) { start = m.index; len = m[0].length; }
      }
    }
    if (start < 0) return escapeHtml(example);
    return escapeHtml(example.slice(0, start)) + '<strong class="hl">' + escapeHtml(example.slice(start, start + len)) + '</strong>' + escapeHtml(example.slice(start + len));
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function tokenizeExample(example) {
    return example.trim().split(/\s+/).map(function (text, idx) {
      return { id: idx, text: text };
    });
  }

  function shuffleTokenOrder(tokens) {
    var ids = tokens.map(function (t) { return t.id; });
    if (ids.length < 2) return ids;
    var original = ids.join(",");
    var shuffled = ids;
    var attempts = 0;
    do {
      shuffled = shuffle(ids);
      attempts++;
    } while (shuffled.join(",") === original && attempts < 8);
    return shuffled;
  }

  var memoryWords = null;
  var hasStorage = (function () {
    try {
      var testKey = "__vocabQuizStorageTest__";
      localStorage.setItem(testKey, "1");
      localStorage.removeItem(testKey);
      return true;
    } catch (e) {
      return false;
    }
  })();

  function loadCachedWords() {
    if (!hasStorage) return memoryWords;
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw === null) return null;
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : null;
    } catch (e) {
      return null;
    }
  }

  function cacheWordsLocally(words) {
    memoryWords = words;
    if (!hasStorage) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
    } catch (e) {
      hasStorage = false;
    }
  }

  var memoryStats = null;

  function loadCachedStats() {
    if (!hasStorage) return memoryStats;
    try {
      var raw = localStorage.getItem(STATS_STORAGE_KEY);
      if (raw === null) return null;
      var parsed = JSON.parse(raw);
      return (parsed && typeof parsed === "object" && parsed.perWord) ? parsed : null;
    } catch (e) {
      return null;
    }
  }

  function cacheStatsLocally(stats) {
    memoryStats = stats;
    if (!hasStorage) return;
    try {
      localStorage.setItem(STATS_STORAGE_KEY, JSON.stringify(stats));
    } catch (e) {
      hasStorage = false;
    }
  }

  // ---- 同期待ちの単語：オフラインで取り込んだ分を端末に残し、電波が戻ったら送る ----
  var PENDING_KEY = "vocabQuizPendingWords_v1";
  function loadPending() { try { var a = JSON.parse(localStorage.getItem(PENDING_KEY) || "[]"); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
  function savePending(list) { try { if (list.length) localStorage.setItem(PENDING_KEY, JSON.stringify(list)); else localStorage.removeItem(PENDING_KEY); } catch (e) {} updateSyncBadge(); }
  function syncBadgeText() {
    var n = loadPending().length;
    if (!navigator.onLine) return n ? "未同期 " + n + "語" : "オフライン";
    return n ? "同期待ち " + n + "語" : "";
  }
  function updateSyncBadge() { var el = document.getElementById("sync-badge"); if (el) el.textContent = syncBadgeText(); }
  function flushPending() {
    var pending = loadPending();
    if (!pending.length || !navigator.onLine) return;
    var have = {}; state.words.forEach(function (w) { have[wkey(w)] = true; });
    pending.forEach(function (w) { if (!have[wkey(w)]) { have[wkey(w)] = true; state.words.push(w); } });
    pushWordsUpdate(state.words, function () { savePending([]); }, function () {});
  }
  window.addEventListener("online", function () { updateSyncBadge(); flushPending(); });
  window.addEventListener("offline", updateSyncBadge);

  // ---- Cloud sync (Firestore) ----
  // Words live in a single shared document so any device sees the same list.
  // localStorage is kept only as an instant-paint / offline cache.

  function applyRemoteWords(words, meta) {
    var pending = loadPending();
    if (pending.length) {
      var have = {}; words.forEach(function (w) { have[wkey(w)] = true; });
      var missing = pending.filter(function (w) { return !have[wkey(w)]; });
      if (missing.length) {
        words = words.concat(missing);
        pushWordsUpdate(words, function () { savePending([]); }, function () {});
      } else if (meta && !meta.hasPendingWrites && !meta.fromCache) {
        savePending([]);  // サーバーに全部届いたのを確かめてから消す
      }
    }
    state.words = words;
    cacheWordsLocally(words);
    if (state.view === "list") {
      updateListResults();
    } else if (state.view === "quiz" && (!state.quiz.current && !state.quiz.finished || state.quiz.totalUnique === 0)) {
      startQuizSession();
      render();
    }
  }

  function pushWordsUpdate(words, onSuccess, onError) {
    cacheWordsLocally(words);
    setDoc(wordsDocRef, { words: words }).then(onSuccess, function (e) {
      if (onError) onError(e);
    });
  }

  function subscribeToWords() {
    onSnapshot(wordsDocRef, function (snap) {
      if (snap.exists() && Array.isArray(snap.data().words)) {
        applyRemoteWords(snap.data().words, snap.metadata);
      } else if (!snap.metadata.fromCache) {
        // オフライン起動時は「データなし」の仮の通知が来るので、サーバーが本当に空と答えたときだけ作る
        // （そうしないとサンプル5語で共有リストを上書きしてしまう）
        setDoc(wordsDocRef, { words: SAMPLE_DATA }).catch(function (e) {
          console.error("Failed to seed shared word list:", e);
        });
      }
    }, function (error) {
      console.error("Firestore sync error (staying on local/cached data):", error);
    });
  }

  function applyRemoteStats(stats) {
    state.stats = stats;
    cacheStatsLocally(stats);
    if (state.view === "stats") render();
  }

  function pushStatsUpdate(stats, onSuccess, onError) {
    cacheStatsLocally(stats);
    setDoc(statsDocRef, stats).then(onSuccess, function (e) {
      if (onError) onError(e);
    });
  }

  function subscribeToStats() {
    onSnapshot(statsDocRef, function (snap) {
      if (snap.exists() && snap.data().perWord) {
        applyRemoteStats(snap.data());
      } else if (!snap.metadata.fromCache) {
        // 単語と同じく、オフライン時の仮の通知で記録を空にしない
        setDoc(statsDocRef, { perWord: {} }).catch(function (e) {
          console.error("Failed to seed shared stats:", e);
        });
      }
    }, function (error) {
      console.error("Firestore stats sync error (staying on local/cached data):", error);
    });
  }

  function dayKey(dt) {
    function pad(n) { return n < 10 ? "0" + n : "" + n; }
    return dt.getFullYear() + "-" + pad(dt.getMonth() + 1) + "-" + pad(dt.getDate());
  }

  function studySummary() {
    var daily = state.stats.daily || {}, now = new Date();
    var today = daily[dayKey(now)] || { a: 0, c: 0 };
    var week = 0;
    for (var i = 0; i < 7; i++) { var dd = daily[dayKey(new Date(now.getTime() - i * 86400000))]; if (dd) week += dd.a; }
    var streak = 0, start = today.a ? 0 : 1;
    for (var j = start; j < 120; j++) { var e = daily[dayKey(new Date(now.getTime() - j * 86400000))]; if (e && e.a) streak++; else break; }
    return { today: today, week: week, streak: streak };
  }

  function recordAnswer(word, correct) {
    var key = word.english.trim().toLowerCase();
    var perWord = state.stats.perWord || (state.stats.perWord = {});
    var entry = perWord[key] || (perWord[key] = { correct: 0, incorrect: 0 });
    if (correct) entry.correct++; else entry.incorrect++;
    // 日付ごとの回数（今日・今週・続けた日数のため）。120日より前は捨てる
    var daily = state.stats.daily || (state.stats.daily = {});
    var t = dayKey(new Date()), d = daily[t] || (daily[t] = { a: 0, c: 0 });
    d.a++; if (correct) d.c++;
    var cutoff = dayKey(new Date(Date.now() - 120 * 86400000));
    Object.keys(daily).forEach(function (k) { if (k < cutoff) delete daily[k]; });
    pushStatsUpdate(state.stats, null, function (e) {
      console.error("Failed to sync stats:", e);
    });
  }

  function validateWordArray(data, opts) {
    opts = opts || {};
    if (!Array.isArray(data)) {
      return { valid: false, error: "JSONは配列（[ ]）である必要があります。" };
    }
    if (!opts.allowEmpty && data.length === 0) {
      return { valid: false, error: "配列が空です。1件以上の単語を含めてください。" };
    }
    var required = ["english", "japanese", "example", "exampleJa"];
    for (var i = 0; i < data.length; i++) {
      var item = data[i];
      if (typeof item !== "object" || item === null || Array.isArray(item)) {
        return { valid: false, error: (i + 1) + "番目の要素がオブジェクトではありません。" };
      }
      for (var k = 0; k < required.length; k++) {
        var key = required[k];
        if (typeof item[key] !== "string" || item[key].trim() === "") {
          return { valid: false, error: (i + 1) + "番目の要素に \"" + key + "\"（文字列）がありません。" };
        }
      }
    }
    var words = data.map(function (item) {
      var word = {
        english: item.english.trim(),
        japanese: item.japanese.trim(),
        example: item.example.trim(),
        exampleJa: item.exampleJa.trim()
      };
      if (typeof item.pos === "string" && item.pos.trim() !== "") word.pos = item.pos.trim();
      if (typeof item.etymology === "string" && item.etymology.trim() !== "") word.etymology = item.etymology.trim();
      if (typeof item.nuance === "string" && item.nuance.trim() !== "") word.nuance = item.nuance.trim();
      if (typeof item.related === "string" && item.related.trim() !== "") word.related = item.related.trim();
      return word;
    });
    return { valid: true, words: words };
  }

  // ---- Quiz session logic ----
  // 1回20語。苦手な単語（最大8）＋まだ出ていない新しい単語（最大8）＋残りから。
  // 進み具合はモードごとに持ち、端末に保存する（タブに触れても、アプリが読み直されても消えない）
  var SESSION_SIZE = 20;
  var SESSION_KEY = "vocabQuizSession_v1";
  var MODES = ["choice", "flashcard", "arrange"];
  var MODE_LABEL = { choice: "選択式", flashcard: "フラッシュカード", arrange: "並べ替え" };

  function quizPool(mode) {
    if (mode === "arrange") {
      return state.words.filter(function (w) { return tokenizeExample(w.example).length >= 2; });
    }
    return state.words.slice();
  }

  function statOf(w) { return (state.stats.perWord || {})[wkey(w)]; }

  function weakList(pool) {
    return pool.map(function (w) {
      var s = statOf(w) || {};
      var bad = s.incorrect || 0, good = s.correct || 0;
      return { w: w, score: bad - good * 0.5 };
    }).filter(function (x) { return x.score > 0; })
      .sort(function (a, b) { return b.score - a.score; })
      .map(function (x) { return x.w; });
  }

  function pickSessionWords(mode, kind, keys) {
    var pool = quizPool(mode);
    if (kind === "retry") {
      var want = {}; (keys || []).forEach(function (k) { want[k] = true; });
      return shuffle(pool.filter(function (w) { return want[wkey(w)]; }));
    }
    if (kind === "weak") return shuffle(weakList(pool).slice(0, SESSION_SIZE));
    var chosen = [], used = {};
    function take(list, n) {
      for (var i = 0; i < list.length && n > 0 && chosen.length < SESSION_SIZE; i++) {
        var k = wkey(list[i]); if (used[k]) continue;
        used[k] = true; chosen.push(list[i]); n--;
      }
    }
    take(weakList(pool), 8);
    take(pool.filter(function (w) { return !statOf(w); }).reverse(), 8);  // 新しく入れた順
    take(shuffle(pool), SESSION_SIZE);
    return shuffle(chosen);
  }

  function newSession(mode, kind, keys) {
    var words = pickSessionWords(mode, kind || "normal", keys);
    var q = {
      mode: mode, kind: kind || "normal", queue: words, totalUnique: words.length, masteredCount: 0,
      questionNumber: 0, current: null, answered: false, revealed: false, selectedChoice: null, isCorrect: null,
      choices: [], arrangeTokens: [], arrangeOrder: [], arrangeSelected: [], finished: words.length === 0,
      firstTry: {}
    };
    state.sessions[mode] = q;
    state.quiz = q;
    if (!q.finished) advanceQuestion();
    return q;
  }

  function startQuizSession(kind, keys) {
    var mode = state.quiz.mode, cur = state.sessions[mode];
    // 途中のふつうの20語は、苦手・ミスの復習のあいだ、とっておく
    if ((kind === "weak" || kind === "retry") && cur && cur.kind === "normal" && !cur.finished && cur.masteredCount < cur.totalUnique) state.parked[mode] = cur;
    if (!kind || kind === "normal") delete state.parked[mode];
    newSession(mode, kind, keys);
    saveSessions();
  }

  function resumeParked() {
    var mode = state.quiz.mode, pk = state.parked[mode];
    if (!pk) return startQuizSession("normal");
    delete state.parked[mode];
    state.sessions[mode] = pk; state.quiz = pk;
    saveSessions();
  }

  // 単語の総入れ替え（復元など）のあとは、全モードのセッションを作り直す
  function resetAllSessions() {
    var mode = state.quiz.mode;
    state.sessions = {}; state.parked = {};
    newSession(mode, "normal");
    saveSessions();
  }

  function saveSessions() {
    if (!hasStorage) return;
    try {
      var out = { v: 1, mode: state.quiz.mode, sessions: {}, parked: {} };
      function pack(q) {
        return {
          kind: q.kind, queue: q.queue.map(wkey), totalUnique: q.totalUnique, masteredCount: q.masteredCount,
          questionNumber: q.questionNumber, current: q.current ? wkey(q.current) : null, answered: q.answered,
          revealed: q.revealed, selectedChoice: q.selectedChoice, isCorrect: q.isCorrect,
          choices: q.choices.map(wkey), arrangeOrder: q.arrangeOrder, arrangeSelected: q.arrangeSelected,
          finished: q.finished, firstTry: q.firstTry
        };
      }
      MODES.forEach(function (m) {
        if (state.sessions[m]) out.sessions[m] = pack(state.sessions[m]);
        if (state.parked[m]) out.parked[m] = pack(state.parked[m]);
      });
      localStorage.setItem(SESSION_KEY, JSON.stringify(out));
    } catch (e) {}
  }

  function restoreSessions() {
    var raw; try { raw = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch (e) { raw = null; }
    if (!raw || raw.v !== 1 || !raw.sessions) return false;
    var byKey = {}; state.words.forEach(function (w) { byKey[wkey(w)] = w; });
    function unpack(m, r) {
      var cur = r.current ? byKey[r.current] : null;
      var q = {
        mode: m, kind: r.kind || "normal",
        queue: (r.queue || []).map(function (k) { return byKey[k]; }).filter(Boolean),
        totalUnique: r.totalUnique || 0, masteredCount: r.masteredCount || 0, questionNumber: r.questionNumber || 0,
        current: cur, answered: !!(cur && r.answered), revealed: !!(cur && r.revealed),
        selectedChoice: r.selectedChoice || null, isCorrect: r.isCorrect,
        choices: (r.choices || []).map(function (k) { return byKey[k]; }).filter(Boolean),
        arrangeTokens: [], arrangeOrder: r.arrangeOrder || [], arrangeSelected: r.arrangeSelected || [],
        finished: !!r.finished, firstTry: r.firstTry || {}
      };
      if (cur && m === "arrange") {
        q.arrangeTokens = tokenizeExample(cur.example);
        if (q.arrangeOrder.length !== q.arrangeTokens.length) { q.arrangeOrder = shuffleTokenOrder(q.arrangeTokens); q.arrangeSelected = []; }
      }
      if (cur && m === "choice" && q.choices.length < 2) q.choices = buildChoices(cur);
      if (!cur && !q.finished) { if (q.queue.length) advanceQuestionFor(q); else q.finished = true; }
      return q;
    }
    MODES.forEach(function (m) {
      if (raw.sessions[m]) state.sessions[m] = unpack(m, raw.sessions[m]);
      if (raw.parked && raw.parked[m]) state.parked[m] = unpack(m, raw.parked[m]);
    });
    var mode = MODES.indexOf(raw.mode) !== -1 ? raw.mode : "choice";
    if (!state.sessions[mode]) return false;
    state.quiz = state.sessions[mode];
    return true;
  }

  function advanceQuestion() { advanceQuestionFor(state.quiz); }

  function advanceQuestionFor(q) {
    if (q.queue.length === 0) {
      q.finished = true;
      q.current = null;
      return;
    }
    q.current = q.queue.shift();
    q.questionNumber++;
    q.answered = false;
    q.revealed = false;
    q.selectedChoice = null;
    q.isCorrect = null;
    if (q.mode === "choice") {
      q.choices = buildChoices(q.current);
    } else if (q.mode === "arrange") {
      q.arrangeTokens = tokenizeExample(q.current.example);
      q.arrangeOrder = shuffleTokenOrder(q.arrangeTokens);
      q.arrangeSelected = [];
    }
  }

  // 外れの選択肢は、なるべく同じ品詞から（消去法で当てにくくする）
  function buildChoices(word) {
    var others = state.words.filter(function (w) { return w.english !== word.english; });
    var same = word.pos ? others.filter(function (w) { return w.pos === word.pos; }) : [];
    var distractors = shuffle(same).slice(0, 3);
    if (distractors.length < 3) {
      var picked = {}; distractors.forEach(function (w) { picked[w.english] = true; });
      distractors = distractors.concat(shuffle(others.filter(function (w) { return !picked[w.english]; })).slice(0, 3 - distractors.length));
    }
    return shuffle([word].concat(distractors));
  }

  function requeueCurrent() {
    var q = state.quiz;
    var pos = Math.min(q.queue.length, 1 + Math.floor(Math.random() * 3));
    q.queue.splice(pos, 0, q.current);
  }

  // 1回目の答えだけを「一度で正解／ミス」として数える
  function noteResult(correct) {
    var q = state.quiz, k = wkey(q.current);
    if (!(k in q.firstTry)) q.firstTry[k] = correct ? 1 : 0;
    if (correct) q.masteredCount++; else requeueCurrent();
    recordAnswer(q.current, correct);
    saveSessions();
  }

  function submitChoice(englishValue) {
    var q = state.quiz;
    if (q.answered) return;
    q.answered = true;
    q.selectedChoice = englishValue;
    q.isCorrect = englishValue === q.current.english;
    noteResult(q.isCorrect);
  }

  function submitArrange() {
    var q = state.quiz;
    if (q.answered) return;
    q.answered = true;
    var answerText = q.arrangeSelected.map(function (id) { return q.arrangeTokens[id].text; }).join(" ");
    var correctText = q.arrangeTokens.map(function (t) { return t.text; }).join(" ");
    q.isCorrect = answerText === correctText;
    noteResult(q.isCorrect);
  }

  function selectArrangeToken(id) {
    var q = state.quiz;
    if (q.answered || q.arrangeSelected.indexOf(id) !== -1) return;
    q.arrangeSelected.push(id);
  }

  function deselectArrangeToken(id) {
    var q = state.quiz;
    if (q.answered) return;
    var idx = q.arrangeSelected.indexOf(id);
    if (idx !== -1) q.arrangeSelected.splice(idx, 1);
  }

  function undoArrangeToken() {
    var q = state.quiz;
    if (q.answered || q.arrangeSelected.length === 0) return;
    q.arrangeSelected.pop();
  }

  function clearArrangeTokens() {
    var q = state.quiz;
    if (q.answered) return;
    q.arrangeSelected = [];
  }

  function flashcardResult(remembered) {
    noteResult(remembered);
    advanceQuestion();
    saveSessions();
  }

  // モードを変えても、それぞれの進み具合はそのまま残る
  function setQuizMode(mode) {
    if (state.quiz.mode === mode) return;
    state.quiz = state.sessions[mode] || newSession(mode);
    saveSessions();
  }

  function missedKeys(q) { return Object.keys(q.firstTry).filter(function (k) { return q.firstTry[k] === 0; }); }

  // ---- Views ----

  var ICON_CHECK = '<svg class="verdict-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
  var ICON_CROSS = '<svg class="verdict-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  function verdictHtml(ok, extra) {
    return '<div class="result-text ' + (ok ? "correct" : "incorrect") + '">' + (ok ? ICON_CHECK + "正解" : ICON_CROSS + "不正解" + (extra || "")) + '</div>';
  }

  function answerDetailHtml(w, noHead, noJa) {
    return '<div class="answer-detail">' +
      (noHead ? '' : '<div class="english-text">' + escapeHtml(w.english) + '</div>') +
      '<div class="example-text">' + highlightExample(w.example, w.english) + '</div>' +
      (noJa ? '' : '<div class="example-ja-text">' + escapeHtml(w.exampleJa) + '</div>') +
      extraDetailsHtml(w) +
      '</div>';
  }

  function sessionCompleteHtml(q) {
    var parked = state.parked[q.mode] && !state.parked[q.mode].finished ? state.parked[q.mode] : null;
    var missed = missedKeys(q);
    var byKey = {}; state.words.forEach(function (w) { byKey[wkey(w)] = w; });
    var firstOk = Object.keys(q.firstTry).length - missed.length;
    var missedRows = missed.map(function (k) { return byKey[k]; }).filter(Boolean).map(function (w) {
      return '<details><summary><div><div class="english-text">' + escapeHtml(w.english) + '</div><div class="japanese-text">' + escapeHtml(w.japanese) + '</div></div><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>' +
        '<div class="detail"><div class="example-text">' + highlightExample(w.example, w.english) + '</div><div class="example-ja-text">' + escapeHtml(w.exampleJa) + '</div></div></details>';
    }).join("");
    var title = { normal: "20語おわりました", weak: "苦手な単語の復習おわり", retry: "ミスした単語の復習おわり" }[q.kind] || "おわりました";
    if (q.kind === "normal" && q.totalUnique < SESSION_SIZE) title = q.totalUnique + "語おわりました";
    return '<div class="card session-complete">' +
      '<p class="complete-title">' + title + '</p>' +
      '<p class="complete-score">一度で正解 <b>' + firstOk + '</b>語 ・ ミス <b>' + missed.length + '</b>語</p>' +
      (missedRows ? '<div class="missed-list">' + missedRows + '</div>' : '') +
      (parked ? '<button class="btn btn-primary" data-action="resume-parked">途中の20語に戻る（残り' + (parked.totalUnique - parked.masteredCount) + '語）</button>'
              : '<button class="btn btn-primary" data-action="next-session">次の' + SESSION_SIZE + '語</button>') +
      (missed.length ? '<button class="btn btn-outline" data-action="retry-missed">ミスだけもう一度（' + missed.length + '語）</button>' : '') +
      (parked ? '' : '<p class="complete-note">次の20語は、苦手な単語（最大8語）と、まだ一度も出ていない新しい単語（最大8語）を優先して選びます。</p>') +
      '</div>';
  }

  function renderQuizView() {
    var q = state.quiz;
    if (state.words.length === 0) {
      return '<div class="view quiz-view empty-state">' +
        '<p>まだ単語が登録されていません。</p>' +
        '<button class="btn btn-primary" data-action="goto-import">取り込み画面へ</button>' +
        '</div>';
    }

    var modeToggle =
      '<div class="mode-toggle">' +
      '<button class="mode-btn ' + (q.mode === "choice" ? "active" : "") + '" data-action="set-mode" data-mode="choice">選択式</button>' +
      '<button class="mode-btn ' + (q.mode === "flashcard" ? "active" : "") + '" data-action="set-mode" data-mode="flashcard">フラッシュカード</button>' +
      '<button class="mode-btn ' + (q.mode === "arrange" ? "active" : "") + '" data-action="set-mode" data-mode="arrange">並べ替え</button>' +
      '</div>';

    if (q.totalUnique === 0 && !q.finished) q.finished = true;
    if (q.totalUnique === 0) {
      var why = q.kind === "weak" ? "苦手な単語はまだありません。" : (q.mode === "arrange" ? "この形式で出題できる単語がありません（例文が2語以上のものが対象です）。" : "出題できる単語がありません。");
      return '<div class="view quiz-view">' + modeToggle +
        '<div class="card session-complete"><p>' + why + '</p>' +
        '<button class="btn btn-primary" data-action="next-session">ふつうの' + SESSION_SIZE + '語を始める</button>' +
        '</div></div>';
    }

    if (q.finished) {
      return '<div class="view quiz-view">' + modeToggle + sessionCompleteHtml(q) + '</div>';
    }

    var kindLabel = { weak: "苦手な単語の復習", retry: "ミスした単語の復習" }[q.kind];
    var pct = Math.round((q.masteredCount / q.totalUnique) * 100);
    var progressHtml = (kindLabel ? '<div class="session-kind">' + kindLabel + '</div>' : '') +
      '<div class="progress-text">残り <b>' + (q.totalUnique - q.masteredCount) + '</b>語　・　' + q.totalUnique + '語中 ' + q.masteredCount + '語正解</div>' +
      '<div class="progress-bar" aria-hidden="true"><span style="width:' + pct + '%"></span></div>' +
      (missedKeys(q).length ? '<div class="progress-note">ミスした単語は、あとでもう一度出ます</div>' : '');

    var w = q.current;
    var questionHtml = "";

    if (q.mode === "choice") {
      if (!q.answered) {
        var choiceButtons = q.choices.map(function (c) {
          return '<button class="choice-btn" data-action="submit-choice" data-value="' + escapeHtml(c.english) + '">' + escapeHtml(c.english) + '</button>';
        }).join("");
        questionHtml =
          '<div class="card question-card">' +
          '<div class="japanese-text">' + escapeHtml(w.japanese) + '</div>' +
          '<div class="choices">' + choiceButtons + '</div>' +
          '</div>';
      } else {
        // 選択肢を残して、正解と自分の答えに印を付ける
        // 正解と自分の答えだけを残し、選ばなかった外れは小さな1行にまとめる（例文がすぐ下に見えるように）
        var picked = null, others = [];
        var marked = q.choices.map(function (c) {
          if (c.english === w.english) return '<button class="choice-btn is-correct" disabled>' + escapeHtml(c.english) + '<span class="tag">正解</span></button>';
          if (c.english === q.selectedChoice) { picked = c; return '<button class="choice-btn is-picked" disabled>' + escapeHtml(c.english) + '<span class="tag">あなたの答え</span></button>'; }
          others.push(c.english); return '';
        }).join("");
        questionHtml =
          '<div class="card question-card pin-bottom">' +
          '<div class="japanese-text">' + escapeHtml(w.japanese) + '</div>' +
          verdictHtml(q.isCorrect) +
          '<div class="choices">' + marked + '</div>' +
          (others.length ? '<div class="other-choices">ほかの選択肢：' + others.map(escapeHtml).join("、") + '</div>' : '') +
          (picked ? '<div class="picked-meaning"><b>' + escapeHtml(picked.english) + '</b> は「' + escapeHtml(picked.japanese) + '」</div>' : '') +
          answerDetailHtml(w, true) +
          '<button class="btn btn-primary sticky-action" data-action="next-question">次の問題へ</button>' +
          '</div>';
      }
    } else if (q.mode === "flashcard") {
      if (!q.revealed) {
        questionHtml =
          '<div class="card question-card pin-bottom fc-q">' +
          '<div class="japanese-text">' + escapeHtml(w.japanese) + '</div>' +
          '<button class="btn btn-primary sticky-action" data-action="reveal-flashcard">答えを見る</button>' +
          '</div>';
      } else {
        questionHtml =
          '<div class="card question-card pin-bottom">' +
          '<div class="japanese-text">' + escapeHtml(w.japanese) + '</div>' +
          answerDetailHtml(w) +
          '<div class="flashcard-buttons sticky-action">' +
          '<button class="btn btn-outline" data-action="flashcard-again">もう一度</button>' +
          '<button class="btn btn-primary" data-action="flashcard-remembered">覚えた</button>' +
          '</div>' +
          '</div>';
      }
    } else {
      questionHtml = renderArrangeQuestion(q, w);
    }

    return '<div class="view quiz-view">' + modeToggle + progressHtml + questionHtml + '</div>';
  }

  // 並べ替えの表示用：文頭の大文字と文末の句点は答えのヒントになるので隠す（答え合わせは元の文で行う）
  function displayToken(text, id, total) {
    var t = text;
    if (id === 0 && t !== "I" && !/^I['’]/.test(t) && /^[A-Z][a-z]/.test(t) && !/[A-Z]/.test(t.slice(1))) t = t.charAt(0).toLowerCase() + t.slice(1);
    if (id === total - 1) t = t.replace(/[.!?]+$/, "") || t;
    return t;
  }

  function renderArrangeQuestion(q, w) {
    var n = q.arrangeTokens.length;
    if (!q.answered) {
      var selectedHtml = q.arrangeSelected.length
        ? q.arrangeSelected.map(function (id) {
            return '<button class="arrange-slot-btn" data-action="arrange-deselect" data-id="' + id + '">' + escapeHtml(displayToken(q.arrangeTokens[id].text, id, n)) + '</button>';
          }).join("")
        : '<span class="arrange-slot-placeholder">タップして単語を並べてください</span>';

      // 置いた語の場所は点線の空き枠として残す（残りの語が動かず、押す位置がずれない）
      var tokenHtml = q.arrangeOrder.map(function (id) {
          var label = escapeHtml(displayToken(q.arrangeTokens[id].text, id, n));
          if (q.arrangeSelected.indexOf(id) !== -1) return '<span class="arrange-token-btn slot-used" aria-hidden="true">' + label + '</span>';
          return '<button class="arrange-token-btn" data-action="arrange-select" data-id="' + id + '">' + label + '</button>';
        }).join("");

      var allSelected = q.arrangeSelected.length === n;

      return '<div class="card question-card arrange-card">' +
        '<div class="japanese-text">' + escapeHtml(w.exampleJa) + '</div>' +
        '<div class="arrange-hint">使う表現：' + escapeHtml(w.japanese) + '</div>' +
        '<div class="arrange-answer-area">' + selectedHtml + '</div>' +
        '<div class="arrange-token-area">' + tokenHtml + '</div>' +
        '<div class="arrange-controls">' +
        '<button class="btn btn-outline" data-action="arrange-undo"' + (q.arrangeSelected.length ? '' : ' disabled') + '>1つ戻す</button>' +
        '<button class="btn btn-outline" data-action="arrange-clear"' + (q.arrangeSelected.length ? '' : ' disabled') + '>クリア</button>' +
        '</div>' +
        '<button class="btn btn-primary" data-action="arrange-submit"' + (allSelected ? '' : ' disabled') + '>答え合わせ</button>' +
        '</div>';
    }

    // 不正解なら、自分が組んだ文を出して、位置が違う単語に印を付ける
    var yours = "";
    if (!q.isCorrect) {
      // 印は「最初にずれた所」だけに付ける
      var firstWrong = -1;
      q.arrangeSelected.forEach(function (id, pos) { if (firstWrong < 0 && q.arrangeTokens[id].text !== q.arrangeTokens[pos].text) firstWrong = pos; });
      yours = '<div class="arrange-yours"><div class="label">あなたの答え（' + (firstWrong + 1) + '語目からずれています）</div><div class="toks">' +
        q.arrangeSelected.map(function (id, pos) {
          var wrong = pos === firstWrong;
          return '<span class="tok' + (wrong ? ' wrong' : '') + '">' + escapeHtml(displayToken(q.arrangeTokens[id].text, id, n)) + '</span>';
        }).join("") + '</div></div>';
    }
    return '<div class="card question-card pin-bottom">' +
      '<div class="japanese-text">' + escapeHtml(w.exampleJa) + '</div>' +
      verdictHtml(q.isCorrect) +
      yours +
      answerDetailHtml(w, false, true) +
      '<button class="btn btn-primary sticky-action" data-action="next-question">次の問題へ</button>' +
      '</div>';
  }

  var POS_ORDER = ["動詞", "句動詞", "イディオム", "名詞", "形容詞", "副詞", "前置詞", "接続詞"];
  var POS_UNSET_LABEL = "品詞未設定";

  function posGroupRank(pos) {
    if (!pos) return POS_ORDER.length + 1;
    var idx = POS_ORDER.indexOf(pos);
    return idx === -1 ? POS_ORDER.length : idx;
  }

  function groupWordsByPos(words) {
    var groups = {};
    words.forEach(function (w) {
      var key = w.pos && w.pos.trim() ? w.pos.trim() : "";
      if (!groups[key]) groups[key] = [];
      groups[key].push(w);
    });
    var keys = Object.keys(groups).sort(function (a, b) {
      var ra = posGroupRank(a), rb = posGroupRank(b);
      if (ra !== rb) return ra - rb;
      return a.localeCompare(b, "ja");
    });
    return keys.map(function (key) {
      var list = groups[key].slice().sort(function (a, b) {
        return a.english.toLowerCase().localeCompare(b.english.toLowerCase());
      });
      return { label: key || POS_UNSET_LABEL, words: list };
    });
  }

  function getAvailablePosFilters() {
    var set = {};
    var hasUnset = false;
    state.words.forEach(function (w) {
      if (w.pos && w.pos.trim()) set[w.pos.trim()] = true;
      else hasUnset = true;
    });
    var keys = Object.keys(set).sort(function (a, b) {
      var ra = posGroupRank(a), rb = posGroupRank(b);
      if (ra !== rb) return ra - rb;
      return a.localeCompare(b, "ja");
    });
    if (hasUnset) keys.push(POS_UNSET_LABEL);
    return keys;
  }

  function matchesPosFilter(w, filterValue) {
    if (!filterValue) return true;
    if (filterValue === POS_UNSET_LABEL) return !w.pos || !w.pos.trim();
    return !!w.pos && w.pos.trim() === filterValue;
  }

  function startingLetter(w) {
    var ch = (w.english || "").trim().charAt(0).toUpperCase();
    return /[A-Z]/.test(ch) ? ch : "#";
  }

  function getAvailableLetterFilters() {
    var set = {};
    state.words.forEach(function (w) { set[startingLetter(w)] = true; });
    return Object.keys(set).sort(function (a, b) {
      if (a === "#") return 1;
      if (b === "#") return -1;
      return a.localeCompare(b);
    });
  }

  function matchesLetterFilter(w, filterValue) {
    if (!filterValue) return true;
    return startingLetter(w) === filterValue;
  }

  // 一覧のカードは英語と意味の1行。押すと例文などが開く
  function wordCardHtml(w) {
    var k = wkey(w), open = state.list.open === k;
    return '<div class="word-card">' +
      '<button class="word-row" data-action="toggle-word" data-key="' + escapeHtml(k) + '" aria-expanded="' + open + '"><div>' +
      '<div class="english-text">' + escapeHtml(w.english) + '</div>' +
      '<div class="japanese-text">' + escapeHtml(w.japanese) + '</div>' +
      '</div><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>' +
      (open ? '<div class="word-detail">' + (w.pos && state.list.sort !== "pos" ? '<div class="pos-badge">' + escapeHtml(w.pos) + '</div>' : '') +
        '<div class="example-text">' + highlightExample(w.example, w.english) + '</div>' +
        '<div class="example-ja-text">' + escapeHtml(w.exampleJa) + '</div>' +
        extraDetailsHtml(w) + '</div>' : '') +
      '</div>';
  }

  function moreButtonHtml(rest) {
    return rest > 0 ? '<button class="btn btn-outline more-btn" data-action="list-more">もっと見る（残り' + rest + '件）</button>' : '';
  }

  function renderListView() {
    var chipsHtml = "";
    if (state.list.sort === "pos") {
      var filterChips = getAvailablePosFilters();
      chipsHtml = '<div class="filter-chips">' +
        '<button class="filter-chip ' + (!state.list.posFilter ? "active" : "") + '" data-action="set-list-filter" data-filter="">すべて</button>' +
        filterChips.map(function (label) {
          return '<button class="filter-chip ' + (state.list.posFilter === label ? "active" : "") + '" data-action="set-list-filter" data-filter="' + escapeHtml(label) + '">' + escapeHtml(label) + '</button>';
        }).join("") +
        '</div>';
    }

    var letterChipsHtml = "";
    if (state.list.sort === "alpha") {
      var letters = getAvailableLetterFilters();
      letterChipsHtml = '<div class="filter-chips">' +
        '<button class="filter-chip chip-letter ' + (!state.list.letterFilter ? "active" : "") + '" data-action="set-list-letter" data-letter="">すべて</button>' +
        letters.map(function (ch) {
          return '<button class="filter-chip chip-letter ' + (state.list.letterFilter === ch ? "active" : "") + '" data-action="set-list-letter" data-letter="' + escapeHtml(ch) + '">' + escapeHtml(ch) + '</button>';
        }).join("") +
        '</div>';
    }

    return '<div class="view list-view">' +
      '<div class="search-bar"><input id="search-input" type="search" inputmode="search" placeholder="キーワードで検索" value="' + escapeHtml(state.list.query) + '"></div>' +
      '<div class="mode-toggle">' +
      '<button class="mode-btn ' + (state.list.sort === "default" ? "active" : "") + '" data-action="set-list-sort" data-sort="default">新しい順</button>' +
      '<button class="mode-btn ' + (state.list.sort === "alpha" ? "active" : "") + '" data-action="set-list-sort" data-sort="alpha">ABC順</button>' +
      '<button class="mode-btn ' + (state.list.sort === "pos" ? "active" : "") + '" data-action="set-list-sort" data-sort="pos">品詞順</button>' +
      '</div>' +
      chipsHtml +
      letterChipsHtml +
      '<div class="count-text" id="list-count"></div>' +
      '<div id="list-results"></div>' +
      '</div>';
  }

  function updateListResults() {
    var query = state.list.query.trim().toLowerCase();
    var posFilter = state.list.sort === "pos" ? state.list.posFilter : "";
    var letterFilter = state.list.sort === "alpha" ? state.list.letterFilter : "";
    var byFilter = state.words.filter(function (w) { return matchesPosFilter(w, posFilter) && matchesLetterFilter(w, letterFilter); });
    var filtered = query
      ? byFilter.filter(function (w) {
          return w.english.toLowerCase().indexOf(query) !== -1 || w.japanese.toLowerCase().indexOf(query) !== -1 ||
            w.example.toLowerCase().indexOf(query) !== -1 || w.exampleJa.toLowerCase().indexOf(query) !== -1;
        })
      : byFilter;

    var countEl = document.getElementById("list-count");
    var resultsEl = document.getElementById("list-results");
    if (!countEl || !resultsEl) return;

    countEl.textContent = query
      ? ("全" + byFilter.length + "件中 " + filtered.length + "件を表示")
      : ("全" + byFilter.length + "件");

    var lim = state.list.limit;
    if (!filtered.length) {
      resultsEl.innerHTML = '<p class="empty-msg">該当する単語がありません。</p>';
    } else if (state.list.sort === "pos") {
      var groups = groupWordsByPos(filtered), shown = 0;
      resultsEl.innerHTML = groups.map(function (g) {
        if (shown >= lim) return "";
        var part = g.words.slice(0, lim - shown); shown += part.length;
        return '<div class="list-group-header">' + escapeHtml(g.label) + '（' + g.words.length + '）</div>' + part.map(wordCardHtml).join("");
      }).join("") + moreButtonHtml(filtered.length - shown);
    } else if (state.list.sort === "alpha") {
      var sorted = filtered.slice().sort(function (a, b) {
        return a.english.toLowerCase().localeCompare(b.english.toLowerCase());
      });
      resultsEl.innerHTML = sorted.slice(0, lim).map(wordCardHtml).join("") + moreButtonHtml(sorted.length - lim);
    } else {
      var newest = filtered.slice().reverse();  // 新しく入れた単語が上
      resultsEl.innerHTML = newest.slice(0, lim).map(wordCardHtml).join("") + moreButtonHtml(newest.length - lim);
    }
  }

  function attachListView() {
    var input = document.getElementById("search-input");
    if (!input) return;
    input.addEventListener("input", function (e) {
      state.list.query = e.target.value;
      state.list.limit = 50;
      updateListResults();
    });
    updateListResults();
  }

  function renderStatsView() {
    var perWord = state.stats.perWord || {};
    var totalCorrect = 0, totalIncorrect = 0;
    Object.keys(perWord).forEach(function (k) {
      totalCorrect += perWord[k].correct || 0;
      totalIncorrect += perWord[k].incorrect || 0;
    });
    var totalAttempts = totalCorrect + totalIncorrect;
    var accuracy = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : 0;

    var summaryHtml = '<div class="card stats-summary">' +
      '<h2>学習サマリー</h2>' +
      (totalAttempts > 0
        ? '<div class="stats-numbers">' +
          '<div class="stat-item"><div class="stat-value">' + totalAttempts + '</div><div class="stat-label">出題数</div></div>' +
          '<div class="stat-item"><div class="stat-value">' + totalCorrect + '</div><div class="stat-label">正答数</div></div>' +
          '<div class="stat-item"><div class="stat-value">' + accuracy + '%</div><div class="stat-label">正答率</div></div>' +
          '</div>'
        : '<p class="hint">まだ学習記録がありません。クイズに挑戦してみましょう。</p>') +
      (function () {
        var sm = studySummary();
        if (!sm.week && !sm.streak) return totalAttempts ? '<div class="today-line"><span>今日・今週の記録は、次に答えたときから数えます</span></div>' : '';
        return '<div class="today-line">' +
          '<span><b>' + sm.today.a + '</b>今日' + (sm.today.a ? '（正解率' + Math.round(sm.today.c / sm.today.a * 100) + '%）' : '') + '</span>' +
          '<span><b>' + sm.week + '</b>この7日間</span>' +
          '<span><b>' + sm.streak + '日</b>続けています</span>' +
          '</div>';
      })() +
      '</div>';

    var wordByKey = {};
    state.words.forEach(function (w) { wordByKey[w.english.trim().toLowerCase()] = w; });

    var ranking = Object.keys(perWord)
      .filter(function (k) { return wordByKey[k] && (perWord[k].incorrect || 0) > 0; })
      .map(function (k) {
        var s = perWord[k];
        var attempts = (s.correct || 0) + (s.incorrect || 0);
        return {
          word: wordByKey[k],
          incorrect: s.incorrect || 0,
          accuracy: attempts ? Math.round(((s.correct || 0) / attempts) * 100) : 0
        };
      })
      .sort(function (a, b) { return b.incorrect - a.incorrect; })
      .slice(0, 10);

    var weakCount = Math.min(SESSION_SIZE, weakList(quizPool(state.quiz.mode)).length);
    var rankingHtml = '<div class="card">' +
      '<h2>苦手な単語ランキング</h2>' +
      (weakCount ? '<button class="btn btn-primary" data-action="start-weak">苦手な' + weakCount + '語を復習する</button>' +
        '<p class="weak-mode-note">' + MODE_LABEL[state.quiz.mode] + 'で出題（途中の20語は残ります）</p>' : '') +
      (ranking.length
        ? '<div class="weak-word-list">' + ranking.map(function (r, i) {
            var k = wkey(r.word), open = state.statsOpen === k;
            return '<button class="weak-word-row" data-action="toggle-weak" data-key="' + escapeHtml(k) + '" aria-expanded="' + open + '">' +
              '<div class="weak-word-rank">' + (i + 1) + '</div>' +
              '<div class="weak-word-main">' +
              '<div class="english-text">' + escapeHtml(r.word.english) + '</div>' +
              '<div class="japanese-text">' + escapeHtml(r.word.japanese) + '</div>' +
              '</div>' +
              '<div class="weak-word-count">' +
              '<div class="weak-word-wrong">' + r.incorrect + '回ミス</div>' +
              '<div class="weak-word-acc">正答率' + r.accuracy + '%</div>' +
              '<div class="acc-bar" aria-hidden="true"><span style="width:' + r.accuracy + '%"></span></div>' +
              '</div>' + '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>' +
              '</button>' +
              (open ? '<div class="weak-word-detail"><div class="example-text">' + highlightExample(r.word.example, r.word.english) + '</div><div class="example-ja-text">' + escapeHtml(r.word.exampleJa) + '</div>' + extraDetailsHtml(r.word) + '</div>' : '');
          }).join("") + '</div>'
        : '<p class="hint">間違えた単語はまだありません。</p>') +
      '</div>';

    return '<div class="view stats-view">' + summaryHtml + rankingHtml + '</div>';
  }

  function renderImportView() {
    var sampleJson = escapeHtml(JSON.stringify(SAMPLE_DATA.slice(0, 2), null, 2));
    return '<div class="view import-view">' +
      '<section class="card">' +
      '<h2>① 新しい単語を取り込む</h2>' +
      '<p class="hint">Claude に作ってもらった単語データ（JSON）を貼り付けて「取り込む」を押してください。英語が同じ単語がすでにあるときは飛ばします（上書きしません）。</p>' +
      '<textarea id="import-textarea" rows="8" placeholder=\'[{"english": "...", "japanese": "...", "example": "...", "exampleJa": "..."}]\'></textarea>' +
      '<div class="import-actions">' +
      '<button class="btn btn-outline" data-action="paste-clipboard">貼り付け</button>' +
      '<button class="btn btn-primary" data-action="import-words" id="import-btn" disabled>取り込む</button>' +
      '</div>' +
      '<div id="import-message" class="message" role="status"></div>' +
      '<details class="example-json">' +
      '<summary>データの形式を見る</summary>' +
      '<p class="hint">english（英語）・japanese（意味）・example（例文）・exampleJa（例文の訳）の4つは必須です。pos（品詞）・etymology（語源）・nuance（ニュアンス）・related（関連表現）は、あれば入れてください。</p>' +
      '<pre>' + sampleJson + '</pre>' +
      '</details>' +
      '</section>' +
      '<section class="card">' +
      '<h2>② データのバックアップ・復元</h2>' +
      '<p class="hint">全単語データをJSONファイルとして書き出したり、書き出したファイルから復元したりできます。復元すると、現在のデータは読み込んだデータで<strong>すべて置き換わります</strong>。</p>' +
      '<button class="btn btn-secondary" data-action="export-words">エクスポート（書き出し）</button>' +
      '<label class="btn btn-secondary file-label">インポート（復元）' +
      '<input type="file" id="restore-file-input" accept="application/json,.json" style="display:none;">' +
      '</label>' +
      '<div id="restore-message" class="message" role="status"></div>' +
      '</section>' +
      '</div>';
  }

  function handleImportWords() {
    var textarea = document.getElementById("import-textarea");
    var msgEl = document.getElementById("import-message");
    var raw = textarea.value;
    var parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (e) {
      msgEl.textContent = "JSONの形式が正しくありません。Claude の出力の [ から ] までを、そのまま貼り付けてください。";
      msgEl.className = "message error";
      return;
    }
    var validation = validateWordArray(parsed);
    if (!validation.valid) {
      msgEl.textContent = validation.error;
      msgEl.className = "message error";
      return;
    }
    var existing = {};
    state.words.forEach(function (w) { existing[w.english.trim().toLowerCase()] = true; });
    var added = 0, skipped = 0, newWords = [];
    validation.words.forEach(function (w) {
      var key = w.english.trim().toLowerCase();
      if (existing[key]) { skipped++; return; }
      existing[key] = true;
      state.words.push(w);
      newWords.push(w);
      added++;
    });
    var skipNote = skipped > 0 ? "（" + skipped + "件は同じ単語があるので飛ばしました）" : "";
    if (!added) {
      msgEl.textContent = "新しい単語はありませんでした" + skipNote + "。";
      msgEl.className = "message";
      textarea.value = "";
      return;
    }
    // 先に「同期待ち」として端末に残す（電波がないまま閉じても消えない）
    savePending(loadPending().concat(newWords));
    var done = false;
    msgEl.textContent = "同期中...";
    msgEl.className = "message";
    var waitTimer = setTimeout(function () {
      if (done) return;
      msgEl.textContent = added + "件をこの端末に保存しました" + skipNote + "。電波のある所でアプリを開くと、自動で同期します。";
      msgEl.className = "message success";
    }, navigator.onLine ? 6000 : 300);
    pushWordsUpdate(state.words, function () {
      done = true; clearTimeout(waitTimer); savePending([]);
      msgEl.textContent = added + "件追加しました" + skipNote + "。他の端末にも反映されます。";
      msgEl.className = "message success";
    }, function (e) {
      done = true; clearTimeout(waitTimer);
      msgEl.textContent = "この端末には追加されましたが、オンライン同期に失敗しました（" + e.message + "）。ネットワーク接続をご確認ください。";
      msgEl.className = "message error";
    });
    textarea.value = "";
    syncImportButton();
  }

  function handleExportWords() {
    var dataStr = JSON.stringify(state.words, null, 2);
    var blob = new Blob([dataStr], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var now = new Date();
    function pad(n) { return n < 10 ? "0" + n : "" + n; }
    var stamp = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate());
    a.href = url;
    a.download = "vocab-quiz-backup-" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    var msgEl = document.getElementById("restore-message");
    msgEl.textContent = "エクスポートしました（" + state.words.length + "件）。";
    msgEl.className = "message success";
  }

  function undoRestore() {
    var msgEl = document.getElementById("restore-message");
    var prev; try { prev = JSON.parse(localStorage.getItem("vocabQuizBeforeRestore_v1") || "null"); } catch (e) { prev = null; }
    if (!Array.isArray(prev)) return;
    state.words = prev;
    resetAllSessions();
    pushWordsUpdate(state.words, function () {
      try { localStorage.removeItem("vocabQuizBeforeRestore_v1"); } catch (e) {}
      if (msgEl) { msgEl.textContent = "元の" + prev.length + "件に戻しました。"; msgEl.className = "message success"; }
    }, function (err) {
      if (msgEl) { msgEl.textContent = "この端末では元に戻しましたが、同期に失敗しました。電波を確かめてください。"; msgEl.className = "message error"; }
    });
  }

  function syncImportButton() {
    var ta = document.getElementById("import-textarea"), btn = document.getElementById("import-btn");
    if (ta && btn) btn.disabled = !ta.value.trim();
  }

  function attachImportView() {
    var ta = document.getElementById("import-textarea");
    if (ta) ta.addEventListener("input", syncImportButton);
  }

  function pasteFromClipboard() {
    var ta = document.getElementById("import-textarea"), msgEl = document.getElementById("import-message");
    if (!navigator.clipboard || !navigator.clipboard.readText) { msgEl.textContent = "入力欄を長押しして「ペースト」を選んでください。"; msgEl.className = "message"; return; }
    navigator.clipboard.readText().then(function (t) { ta.value = t; msgEl.textContent = ""; syncImportButton(); }, function () {
      msgEl.textContent = "貼り付けできませんでした。入力欄を長押しして「ペースト」を選んでください。"; msgEl.className = "message";
    });
  }

  function handleRestoreFile(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      var msgEl = document.getElementById("restore-message");
      var parsed;
      try {
        parsed = JSON.parse(ev.target.result);
      } catch (err) {
        msgEl.textContent = "ファイルの形式が正しくありません。このアプリで書き出したファイルを選んでください。";
        msgEl.className = "message error";
        return;
      }
      var validation = validateWordArray(parsed, { allowEmpty: true });
      if (!validation.valid) {
        msgEl.textContent = validation.error;
        msgEl.className = "message error";
        return;
      }
      if (!navigator.onLine) {
        msgEl.textContent = "電波がないので復元を止めました。電波のある所でもう一度選んでください。";
        msgEl.className = "message error";
        e.target.value = "";
        return;
      }
      var confirmed = window.confirm(
        "現在の" + state.words.length + "件のデータを、読み込んだ" + validation.words.length + "件のデータで置き換えます。よろしいですか？"
      );
      if (!confirmed) {
        msgEl.textContent = "復元をキャンセルしました。";
        msgEl.className = "message";
        return;
      }
      var canUndo = false;
      try { localStorage.setItem("vocabQuizBeforeRestore_v1", JSON.stringify(state.words)); canUndo = true; } catch (err0) {}
      state.words = validation.words;
      resetAllSessions();
      msgEl.textContent = "同期中...";
      msgEl.className = "message";
      var undoBtn = canUndo ? '<button class="btn btn-outline" data-action="undo-restore">復元を取り消して元に戻す</button>' : '';
      var restored = false;
      var restoreTimer = setTimeout(function () {
        if (restored) return;
        msgEl.innerHTML = escapeHtml("この端末では" + validation.words.length + "件で復元しました。同期は電波が安定してから自動で続きます。") + undoBtn;
        msgEl.className = "message success";
      }, 6000);
      pushWordsUpdate(state.words, function () {
        restored = true; clearTimeout(restoreTimer);
        msgEl.innerHTML = escapeHtml(validation.words.length + "件のデータで復元しました。他の端末にも反映されます。") +
          (canUndo ? '<button class="btn btn-outline" data-action="undo-restore">復元を取り消して元に戻す</button>' : '');
        msgEl.className = "message success";
      }, function (err2) {
        restored = true; clearTimeout(restoreTimer);
        msgEl.textContent = "この端末には復元されましたが、オンライン同期に失敗しました（" + err2.message + "）。ネットワーク接続をご確認ください。";
        msgEl.className = "message error";
      });
      e.target.value = "";
    };
    reader.readAsText(file);
  }

  // ---- Router / render ----

  function viewHtml() {
    if (state.view === "quiz") return renderQuizView();
    if (state.view === "list") return renderListView();
    if (state.view === "stats") return renderStatsView();
    if (state.view === "import") return renderImportView();
    return "";
  }

  // ---- 表示テーマ：自動（iPhoneの設定）→ ダーク → ライト ----
  var THEME_KEY = "vocabQuizTheme";
  var sysDark = window.matchMedia("(prefers-color-scheme: dark)");
  var ICON_SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
  var ICON_MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  function themePref() { try { return localStorage.getItem(THEME_KEY) || "auto"; } catch (e) { return "auto"; } }
  function themeButtonHtml() {
    var pref = themePref();
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    var label = { auto: "表示：自動（iPhoneの設定に合わせる）", dark: "表示：ダーク", light: "表示：ライト" }[pref];
    return '<button class="theme-toggle" data-action="toggle-theme" aria-label="' + label + '。押すと切り替え" title="' + label + '">' +
      (dark ? ICON_MOON : ICON_SUN) + (pref === "auto" ? '<span class="auto" aria-hidden="true">自動</span>' : '') + '</button>';
  }
  function applyTheme() {
    var pref = themePref();
    var t = pref === "auto" ? (sysDark.matches ? "dark" : "light") : pref;
    document.documentElement.setAttribute("data-theme", t);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = t === "dark" ? "#11161d" : "#3f6fa8";
    var btn = document.querySelector(".theme-toggle");
    if (btn) btn.outerHTML = themeButtonHtml();  // 画面全体は描き直さない（入力中の文字を消さない）
  }
  function cycleTheme() {
    var next = { auto: "dark", dark: "light", light: "auto" }[themePref()];
    try { if (next === "auto") localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyTheme();
  }
  if (sysDark.addEventListener) sysDark.addEventListener("change", applyTheme); else if (sysDark.addListener) sysDark.addListener(applyTheme);

  function render() {
    var app = document.getElementById("app");
    app.innerHTML =
      '<header class="app-header"><span class="sync-badge" id="sync-badge" role="status">' + escapeHtml(syncBadgeText()) + '</span><h1>英単語クイズ</h1>' + themeButtonHtml() + '</header>' +
      '<main class="app-main">' + viewHtml() + '</main>' +
      '<nav class="bottom-nav">' +
      '<button class="nav-btn ' + (state.view === "quiz" ? "active" : "") + '" data-action="nav" data-view="quiz"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg></span><span>クイズ</span></button>' +
      '<button class="nav-btn ' + (state.view === "list" ? "active" : "") + '" data-action="nav" data-view="list"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01" stroke-width="2.6"/></svg></span><span>一覧</span></button>' +
      '<button class="nav-btn ' + (state.view === "stats" ? "active" : "") + '" data-action="nav" data-view="stats"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M7 16v-5M12 16V6M17 16v-8"/></svg></span><span>統計</span></button>' +
      '<button class="nav-btn ' + (state.view === "import" ? "active" : "") + '" data-action="nav" data-view="import"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4v10M7.5 10l4.5 4.5 4.5-4.5"/><path d="M4 16v3.5h16V16"/></svg></span><span>取り込み</span></button>' +
      '</nav>';
    if (state.view === "list") attachListView();
    if (state.view === "import") attachImportView();
  }

  function setView(view) {
    state.view = view;
    render();
  }

  document.addEventListener("click", function (e) {
    var target = e.target.closest("[data-action]");
    if (!target) return;
    var action = target.dataset.action;
    switch (action) {
      case "nav": setView(target.dataset.view); return;
      case "toggle-theme": cycleTheme(); return;
      case "goto-import": setView("import"); return;
      case "restart-quiz": case "next-session": startQuizSession("normal"); render(); return;
      case "retry-missed": startQuizSession("retry", missedKeys(state.quiz)); render(); return;
      case "start-weak": startQuizSession("weak"); setView("quiz"); window.scrollTo(0, 0); return;
      case "toggle-weak": state.statsOpen = state.statsOpen === target.dataset.key ? "" : target.dataset.key; render(); return;
      case "undo-restore": undoRestore(); return;
      case "paste-clipboard": pasteFromClipboard(); return;
      case "set-mode": setQuizMode(target.dataset.mode); render(); return;
      case "set-list-sort": state.list.sort = target.dataset.sort; state.list.limit = 50; render(); return;
      case "set-list-filter": state.list.posFilter = target.dataset.filter; state.list.limit = 50; render(); return;
      case "set-list-letter": state.list.letterFilter = target.dataset.letter; state.list.limit = 50; render(); return;
      case "toggle-word": state.list.open = state.list.open === target.dataset.key ? "" : target.dataset.key; updateListResults(); return;
      case "list-more": state.list.limit += 50; updateListResults(); return;
      case "resume-parked": resumeParked(); render(); window.scrollTo(0, 0); return;
      case "submit-choice": submitChoice(target.dataset.value); render(); return;
      case "next-question": advanceQuestion(); saveSessions(); render(); window.scrollTo(0, 0); return;
      case "flashcard-again": flashcardResult(false); render(); window.scrollTo(0, 0); return;
      case "reveal-flashcard": state.quiz.revealed = true; saveSessions(); render(); return;
      case "flashcard-remembered": flashcardResult(true); render(); window.scrollTo(0, 0); return;
      case "arrange-select": selectArrangeToken(parseInt(target.dataset.id, 10)); saveSessions(); render(); return;
      case "arrange-deselect": deselectArrangeToken(parseInt(target.dataset.id, 10)); saveSessions(); render(); return;
      case "arrange-undo": undoArrangeToken(); saveSessions(); render(); return;
      case "arrange-clear": clearArrangeTokens(); saveSessions(); render(); return;
      case "arrange-submit": submitArrange(); render(); return;
      case "import-words": handleImportWords(); return;
      case "export-words": handleExportWords(); return;
    }
  });

  document.addEventListener("change", function (e) {
    if (e.target && e.target.id === "restore-file-input") {
      handleRestoreFile(e);
    }
  });

  function init() {
    try {
      state.words = loadCachedWords() || [];
      state.stats = loadCachedStats() || { perWord: {} };
      if (!restoreSessions()) startQuizSession("normal");
      render();
      subscribeToWords();
      subscribeToStats();
    } catch (e) {
      document.getElementById("app").innerHTML =
        '<div style="padding:40px 20px;text-align:center;color:#bf444b;line-height:1.6;">' +
        '読み込み中にエラーが発生しました。<br>' + escapeHtml(e && e.message ? e.message : String(e)) +
        '</div>';
    }
  }

  // iPhoneのSafariは、タッチの受け口がないと押している間の色（:active）を出さない
  document.addEventListener("touchstart", function () {}, { passive: true });

  applyTheme();
  init();
})();
</script>
<script>
  // オフライン対応：公開ページ（https）でだけ service worker を登録。アプリに戻るたびに新しい版がないか確かめる
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      document.addEventListener("visibilitychange", function () { if (!document.hidden) reg.update().catch(function () {}); });
    }).catch(function () {});
  }
</script>

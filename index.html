<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="apple-mobile-web-app-title" content="英単語クイズ">
<link rel="manifest" href="manifest.json">

<title>英単語クイズ</title>
<script>
  // 夜に開いたとき一瞬明るくならないよう、本体より先にテーマを決める（保存がなければiPhoneの設定に合わせる）
  try { var t = localStorage.getItem("vocabQuizTheme"); document.documentElement.setAttribute("data-theme", t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")); } catch (e) {}
</script>
<style>
  :root {
    --color-bg: #f4f6f9;
    --color-card: #ffffff;
    --color-primary: #3f6fa8;
    --color-primary-dark: #2f5686;
    --color-success: #2c7d57;
    --color-error: #bf444b;
    --color-text: #24303f;
    --color-text-muted: #636e7c;
    --color-border: #e2e6ec;
    --color-on-primary: #ffffff;
    --color-primary-press: #2f5686;
    --color-wash: #eef2f7;
    --color-wash-strong: #cfdbe9;
    --color-track: #eef1f5;
    --color-thumb: #ffffff;
    --color-thumb-press: rgba(255,255,255,0.55);
    --shadow-card: 0 1px 3px rgba(20,30,50,0.06);
    --shadow-thumb: 0 1px 2px rgba(0,0,0,0.08);
    --radius: 14px;
    color-scheme: light;
  }
  /* 夜の自習室：深い紺の地に少し明るいカード。デニムブルーは暗い地で読める明るさに上げ、塗りの上の文字は紺にする */
  html[data-theme="dark"] {
    --color-bg: #11161d;
    --color-card: #1a212b;
    --color-primary: #7fa8dc;
    --color-primary-dark: #a8c5ea;
    --color-success: #5bbf8e;
    --color-error: #f0797f;
    --color-text: #e3e8ef;
    --color-text-muted: #9ba6b4;
    --color-border: #2e3846;
    --color-on-primary: #0e1724;
    --color-primary-press: #6593cc;
    --color-wash: #22304a;
    --color-wash-strong: #2f4366;
    --color-track: #1a212b;
    --color-thumb: #29323f;
    --color-thumb-press: rgba(255,255,255,0.06);
    --shadow-card: 0 1px 3px rgba(0,0,0,0.35);
    --shadow-thumb: 0 1px 2px rgba(0,0,0,0.4);
    color-scheme: dark;
  }
  html { -webkit-text-size-adjust: 100%; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  input, textarea, button, select { font-family: inherit; }
  ::selection { background: var(--color-wash-strong); color: var(--color-text); }
  input, textarea { caret-color: var(--color-primary); }
  input[type="search"], input[type="text"], textarea { font-size: 16px; }

  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  .app-header { position: relative; padding-top: calc(env(safe-area-inset-top) + 16px); padding-bottom: 12px; text-align: center; }
  .theme-toggle { position: absolute; right: 8px; top: calc(env(safe-area-inset-top) + 10px); width: 44px; height: 44px; border: none; background: none; border-radius: 10px; color: var(--color-text-muted); display: flex; flex-direction: column; gap: 1px; align-items: center; justify-content: center; cursor: pointer; transition: background-color .12s ease-out; }
  .theme-toggle:active { background: var(--color-wash); }
  .sync-badge { position: absolute; left: 12px; top: calc(env(safe-area-inset-top) + 21px); font-size: 0.72rem; font-weight: 700; color: var(--color-text-muted); border: 1px solid var(--color-border); border-radius: 999px; padding: 2px 8px; }
  .sync-badge:empty { display: none; }
  .theme-toggle svg { flex-shrink: 0; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .theme-toggle .auto { font-size: 0.68rem; font-weight: 700; line-height: 1; padding: 1px 4px; border-radius: 999px; background: var(--color-wash); color: var(--color-primary); }
  .app-header h1 { font-size: 1.2rem; margin: 0; color: var(--color-primary-dark); letter-spacing: .02em; }

  .app-main { flex: 1; padding: 8px 16px calc(84px + env(safe-area-inset-bottom)); }
  .view { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }

  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    max-width: 480px; margin: 0 auto;
    display: flex; background: var(--color-card); border-top: 1px solid var(--color-border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn { flex: 1; border: none; background: none; padding: 10px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.72rem; color: var(--color-text-muted); }
  .nav-btn .nav-icon { line-height: 0; }
  .nav-btn .nav-icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .nav-btn:active { background: var(--color-bg); }
  .nav-btn.active { color: var(--color-primary); font-weight: 600; }

  .card { background: var(--color-card); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-card); }

  .btn { display: block; width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 1rem; font-weight: 600; margin-top: 10px; min-height: 48px; cursor: pointer; }
  .btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
  .btn-primary:active:not(:disabled) { background: var(--color-primary-press); }
  .btn-secondary { background: var(--color-wash); color: var(--color-primary-dark); }
  .btn-secondary:active:not(:disabled) { background: var(--color-wash-strong); }
  .btn-outline { background: var(--color-card); border: 1px solid var(--color-border); color: var(--color-text); }
  .btn-outline:active:not(:disabled) { background: var(--color-wash); border-color: var(--color-wash-strong); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  /* 押した手応え：押している間だけ色が沈み、わずかに縮む */
  .btn, .choice-btn, .mode-btn, .nav-btn, .filter-chip, .arrange-token-btn, .arrange-slot-btn { transition: background-color .12s ease-out, color .12s ease-out, transform .12s ease-out; }
  .btn:active:not(:disabled), .choice-btn:active, .arrange-token-btn:active, .arrange-slot-btn:active, .filter-chip:active { transform: scale(0.97); }
  @media (prefers-reduced-motion: reduce) { .btn, .choice-btn, .mode-btn, .nav-btn, .filter-chip, .arrange-token-btn, .arrange-slot-btn { transition: none; transform: none !important; } }

  .mode-toggle { display: flex; background: transparent; border: 1px solid var(--color-border); border-radius: 10px; padding: 4px; }
  .mode-btn { flex: 1; border: none; background: none; padding: 10px 2px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; color: var(--color-text-muted); min-height: 40px; white-space: nowrap; }
  .mode-btn:active:not(.active) { background: var(--color-thumb-press); color: var(--color-text); }
  .mode-btn.active { background: var(--color-thumb); color: var(--color-primary); box-shadow: var(--shadow-thumb); }

  .progress-text { font-variant-numeric: tabular-nums; text-align: center; font-size: 0.85rem; color: var(--color-text-muted); }
  .progress-text b { color: var(--color-text); font-size: 1rem; }
  .progress-note { text-align: center; font-size: 0.75rem; color: var(--color-text-muted); margin-top: -8px; }
  .progress-bar { height: 4px; border-radius: 999px; background: var(--color-wash); overflow: hidden; margin-top: -6px; }
  .progress-bar span { display: block; height: 100%; background: var(--color-primary); border-radius: 999px; transition: width .3s ease-out; }
  .session-kind { text-align: center; font-size: 0.8rem; font-weight: 700; color: var(--color-primary); margin-bottom: -8px; }

  .question-card { text-align: center; }
  .japanese-text { text-wrap: balance; word-break: auto-phrase; font-size: 1.3rem; font-weight: 500; color: var(--color-text); margin-bottom: 18px; line-height: 1.6; }
  .english-text { font-size: 1.5rem; font-weight: 700; color: var(--color-primary-dark); margin-bottom: 10px; }
  .example-text { font-size: 0.95rem; color: var(--color-text); font-style: italic; margin-top: 14px; line-height: 1.5; }
  .example-ja-text { font-size: 0.85rem; color: var(--color-text-muted); margin-top: 4px; line-height: 1.5; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn { padding: 14px; border-radius: 10px; border: 1px solid var(--color-border); background: var(--color-card); font-size: 1.05rem; font-weight: 600; color: var(--color-text); min-height: 48px; }
  .choice-btn:active { background: var(--color-wash); }
  .choice-btn:disabled { cursor: default; color: var(--color-text-muted); }
  .choice-btn.is-correct { border: 2px solid var(--color-success); color: var(--color-text); }
  .choice-btn.is-picked { border: 2px solid var(--color-error); color: var(--color-text); }
  .choice-btn .tag { display: block; font-size: 0.75rem; font-weight: 700; margin-top: 2px; }
  .choice-btn.is-correct .tag { color: var(--color-success); }
  .choice-btn.is-picked .tag { color: var(--color-error); }
  .other-choices { font-size: 0.8rem; color: var(--color-text-muted); margin-top: 8px; line-height: 1.5; }
  .picked-meaning { font-size: 0.85rem; color: var(--color-text-muted); margin-top: 10px; line-height: 1.5; }
  .picked-meaning b { color: var(--color-text); }
  .hl { font-weight: 700; color: var(--color-primary-dark); }
  .verdict-icon { width: 1.1em; height: 1.1em; vertical-align: -0.18em; margin-right: 4px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

  .result-text { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
  .result-text.correct { color: var(--color-success); }
  .result-text.incorrect { color: var(--color-error); }
  .answer-detail { border-top: 1px solid var(--color-border); margin-top: 14px; padding-top: 14px; }

  .extra-details { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--color-border); text-align: left; }
  .extra-item { font-size: 0.82rem; color: var(--color-text); margin-top: 6px; line-height: 1.5; }
  .extra-item:first-child { margin-top: 0; }
  .extra-label { display: inline-block; font-size: 0.68rem; font-weight: 700; color: var(--color-primary); background: var(--color-wash); padding: 1px 6px; border-radius: 999px; margin-right: 6px; vertical-align: middle; }

  .flashcard-buttons { display: flex; gap: 10px; margin-top: 6px; }
  /* 「次の問題へ」は、答えが長くても画面下（タブの上）に貼り付いて、いつも同じ所で押せる */
  /* 「次の問題へ」「覚えた／もう一度」は画面下（タブの上）に貼り付く。上に薄いぼかしを付けて、下にまだ続くとわかるように */
  .sticky-action { position: sticky; bottom: calc(70px + env(safe-area-inset-bottom)); z-index: 2; box-shadow: 0 0 0 10px var(--color-card); }
  .sticky-action::before { content: ""; position: absolute; left: -18px; right: -18px; top: -34px; height: 24px; background: linear-gradient(to bottom, transparent, var(--color-card)); pointer-events: none; }
  .flashcard-buttons.sticky-action { background: var(--color-card); }
  /* ボタンのあるカードは画面の下端まで伸ばし、答えが短くてもボタンはいつも同じ低い位置に */
  .question-card.pin-bottom { display: flex; flex-direction: column; min-height: calc(100svh - 300px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
  .question-card.pin-bottom > .sticky-action { margin-top: auto; }
  .question-card.pin-bottom > :nth-last-child(2) { margin-bottom: 14px; }
  .question-card.fc-q > .japanese-text { margin: auto 0; padding-bottom: 8px; }
  .weak-mode-note { font-size: 0.78rem; color: var(--color-text-muted); text-align: center; margin: 6px 0 4px; }
  .flashcard-buttons .btn { margin-top: 0; }

  .arrange-hint { font-size: 0.8rem; color: var(--color-text-muted); margin-bottom: 4px; }
  .arrange-answer-area { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; justify-content: flex-start; min-height: 52px; padding: 10px; border: 1px dashed var(--color-border); border-radius: 10px; margin: 14px 0; text-align: left; }
  .arrange-slot-placeholder { font-size: 0.85rem; color: var(--color-text-muted); }
  .arrange-slot-btn { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--color-primary); background: var(--color-wash); color: var(--color-primary-dark); font-weight: 600; font-size: 0.95rem; min-height: 40px; }
  .arrange-slot-btn:active { background: var(--color-wash-strong); }
  .arrange-token-area { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 14px; }
  .arrange-token-btn { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-card); color: var(--color-text); font-weight: 600; font-size: 0.95rem; min-height: 40px; }
  .arrange-token-btn:active { background: var(--color-wash); }
  .arrange-token-btn.slot-used { border-style: dashed; background: transparent; color: transparent; pointer-events: none; }
  .arrange-controls { display: flex; gap: 10px; }
  .arrange-yours { text-align: left; margin: 12px 0 4px; }
  .arrange-yours .label { font-size: 0.75rem; font-weight: 700; color: var(--color-text-muted); margin-bottom: 6px; }
  .arrange-yours .toks { display: flex; flex-wrap: wrap; gap: 6px; }
  .arrange-yours .tok { padding: 4px 8px; border-radius: 8px; border: 1px solid var(--color-border); font-weight: 600; font-size: 0.9rem; }
  .arrange-yours .tok.wrong { border-color: var(--color-error); color: var(--color-error); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .arrange-controls .btn { margin-top: 0; }

  .session-complete { text-align: center; }
  .complete-title { font-size: 1.3rem; font-weight: 700; color: var(--color-primary-dark); margin: 4px 0 6px; }
  .complete-score { font-variant-numeric: tabular-nums; color: var(--color-text-muted); font-size: 0.95rem; margin: 0 0 14px; }
  .complete-score b { color: var(--color-text); font-size: 1.15rem; }
  .missed-list { text-align: left; border-top: 1px solid var(--color-border); margin-top: 6px; }
  .missed-list details { border-bottom: 1px solid var(--color-border); }
  .missed-list summary { list-style: none; padding: 10px 0; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .missed-list summary::-webkit-details-marker { display: none; }
  .missed-list summary > div { flex: 1; min-width: 0; }
  .missed-list details[open] summary .chev, .weak-word-row[aria-expanded="true"] .chev, .word-row[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .missed-list .detail { padding: 0 0 12px; }
  .chev { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: var(--color-text-muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s ease-out; }
  .complete-note { font-size: 0.78rem; color: var(--color-text-muted); margin-top: 12px; line-height: 1.6; }
  .missed-list .row { padding: 10px 0; border-bottom: 1px solid var(--color-border); }
  .missed-list .row .english-text { font-size: 1rem; margin-bottom: 2px; }
  .missed-list .row .japanese-text { font-size: 0.85rem; margin-bottom: 0; }

  .empty-state { text-align: center; padding-top: 60px; color: var(--color-text-muted); }

  ::placeholder { color: var(--color-text-muted); opacity: 1; }
  .search-bar input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--color-border); background: var(--color-card); color: var(--color-text); }
  .count-text { font-variant-numeric: tabular-nums; font-size: 0.8rem; color: var(--color-text-muted); text-align: right; }
  .word-card { background: var(--color-card); border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow-card); }
  .pos-badge { display: inline-block; font-size: 0.7rem; font-weight: 700; color: var(--color-primary); background: var(--color-wash); padding: 2px 8px; border-radius: 999px; margin-bottom: 6px; }
  .filter-chips { display: flex; flex-wrap: nowrap; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; -webkit-overflow-scrolling: touch; }
  .filter-chips::-webkit-scrollbar { display: none; }
  .filter-chip { flex-shrink: 0; }
  .word-row { display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: none; padding: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .word-row > div { flex: 1; min-width: 0; }
  .word-card { transition: background-color .12s ease-out; }
  .word-card .word-detail { margin-top: 8px; }
  .more-btn { margin-top: 4px; }
  .today-line { display: flex; justify-content: space-around; border-top: 1px solid var(--color-border); margin-top: 14px; padding-top: 12px; font-size: 0.85rem; color: var(--color-text-muted); font-variant-numeric: tabular-nums; }
  .today-line b { display: block; text-align: center; font-size: 1.05rem; color: var(--color-text); }
  .filter-chip { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--color-border); background: var(--color-card); font-size: 0.82rem; font-weight: 600; color: var(--color-text-muted); min-height: 40px; }
  .filter-chip:active:not(.active) { background: var(--color-wash); }
  .filter-chip.active { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-on-primary); }
  .filter-chip.chip-letter { padding: 6px 10px; min-width: 30px; text-align: center; }
  .list-group-header { font-size: 0.8rem; font-weight: 700; color: var(--color-primary-dark); background: var(--color-wash); padding: 6px 10px; border-radius: 8px; }
  .word-card .english-text { font-size: 1.1rem; margin-bottom: 2px; }
  .word-card .japanese-text { font-size: 0.95rem; font-weight: 500; color: var(--color-text); margin-bottom: 0; }
  .word-card .example-text { margin-top: 8px; }
  #list-results { display: flex; flex-direction: column; gap: 10px; }
  .empty-msg { text-align: center; color: var(--color-text-muted); padding: 30px 0; }

  .stats-numbers { display: flex; justify-content: space-around; margin-top: 10px; }
  .stat-item { text-align: center; }
  .stat-value { font-variant-numeric: tabular-nums; font-size: 1.4rem; font-weight: 700; color: var(--color-primary-dark); }
  .stat-label { font-size: 0.75rem; color: var(--color-text-muted); margin-top: 2px; }
  .weak-word-list { display: flex; flex-direction: column; gap: 0; margin-top: 10px; }
  .weak-word-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border: none; border-bottom: 1px solid var(--color-border); background: none; width: 100%; text-align: left; color: inherit; font: inherit; cursor: pointer; transition: background-color .12s ease-out; }
  .weak-word-row:active { background: var(--color-wash); }
  .weak-word-detail { padding: 2px 0 12px 30px; border-bottom: 1px solid var(--color-border); }
  .weak-word-detail .example-text { margin-top: 4px; }
  .acc-bar { width: 64px; height: 4px; border-radius: 999px; background: var(--color-wash); overflow: hidden; margin: 4px 0 0 auto; }
  .acc-bar span { display: block; height: 100%; background: var(--color-primary); border-radius: 999px; }
  .weak-word-row:last-child { border-bottom: none; padding-bottom: 0; }
  .weak-word-rank { width: 20px; text-align: center; font-weight: 700; color: var(--color-text-muted); flex-shrink: 0; }
  .weak-word-main { flex: 1; min-width: 0; }
  .weak-word-main .english-text { font-size: 1rem; margin-bottom: 2px; }
  .weak-word-main .japanese-text { font-size: 0.85rem; margin-bottom: 0; }
  .weak-word-count { text-align: right; flex-shrink: 0; }
  .weak-word-wrong { font-variant-numeric: tabular-nums; font-size: 0.85rem; font-weight: 700; color: var(--color-text-muted); }
  .weak-word-acc { font-size: 0.72rem; color: var(--color-text-muted); margin-top: 2px; }

  textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--color-border); resize: vertical; background: var(--color-card); color: var(--color-text); }
  .hint { font-size: 0.82rem; color: var(--color-text-muted); line-height: 1.6; margin: 6px 0 12px; }
  .message { font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }
  .message.success { color: var(--color-success); }
  .message.error { color: var(--color-error); }
  h2 { font-size: 1rem; margin: 0 0 4px; color: var(--color-primary-dark); }
  details.example-json { margin-top: 14px; font-size: 0.85rem; }
  details.example-json summary { cursor: pointer; color: var(--color-primary); font-weight: 600; }
  details.example-json pre { background: var(--color-bg); color: var(--color-text); padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 0.75rem; margin-top: 8px; }
  .file-label { text-align: center; }
  .import-actions { display: flex; gap: 10px; }
  .import-actions .btn { margin-top: 10px; }
  .message .btn { margin-top: 8px; }
</style>
